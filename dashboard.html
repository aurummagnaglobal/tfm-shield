<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Terminal | Aurum Magna Global</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.4); --obsidian: #0b0b0b; --card-bg: #1a1a1a; }
        body { background-color: var(--obsidian); color: white; font-family: 'Inter', sans-serif; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .dashboard-container { width: 100%; max-width: 450px; padding: 20px; text-align: center; }
        h1 { font-family: 'Cinzel', serif; color: var(--gold); letter-spacing: 2px; margin-bottom: 5px; }
        
        /* NEW: TAB NAVIGATION */
        .nav-tabs { display: flex; justify-content: space-around; margin: 20px 0; border-bottom: 1px solid #333; }
        .tab-btn { background: none; border: none; color: #666; font-family: 'Cinzel', serif; padding: 10px; cursor: pointer; font-size: 0.7rem; transition: 0.3s; }
        .tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* [UNCHANGED STYLES] */
        .meter-box { width: 220px; height: 220px; border: 2px solid var(--gold); border-radius: 50%; margin: 20px auto; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 0 25px var(--gold-glow); background: radial-gradient(circle, #222 0%, #000 100%); }
        .meter-box h2 { font-size: 2.5rem; color: var(--gold); margin: 0; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid #333; }
        .vastu-card { background: #111; border-left: 4px solid var(--gold); margin-top: 25px; padding: 15px; text-align: left; }
        .zap-btn { width: 100%; margin-top: 20px; padding: 15px; background: var(--gold); border: none; color: black; font-weight: bold; font-family: 'Cinzel', serif; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body onload="initializeDashboard()">
    <div class="dashboard-container">
        <h1>AURUM MAGNA</h1>
        <p style="color: #666; font-size: 0.7rem;">Sovereign Wealth OS v1.0</p>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('debt')">🛡️ FORTRESS</button>
            <button class="tab-btn" onclick="switchTab('stocks')">📈 STOCKS</button>
            <button class="tab-btn" onclick="switchTab('crypto')">₿ CRYPTO</button>
        </div>

        <!-- [UNCHANGED] DEBT FORTRESS TAB -->
        <div id="debt" class="tab-content active">
            <div class="meter-box" id="meter">
                <h2 id="strength">5%</h2>
                <p style="color:var(--gold); font-size:0.6rem;">SHIELD STRENGTH</p>
            </div>
            <div class="stats-grid">
                <div class="card"><p style="font-size:0.6rem; color:#888;">TARGET</p><h3 id="target">₹0</h3></div>
                <div class="card"><p style="font-size:0.6rem; color:#888;">RECLAIMED</p><h3 id="reclaimed" style="color: var(--gold);">₹0</h3></div>
            </div>
            <div class="vastu-card"><b>🛡️ VASTU ALIGNMENT</b><p id="tip" style="font-size: 0.8rem;"></p></div>
            <button class="zap-btn" onclick="executeZap()">EXECUTE DAILY ZAP</button>
        </div>

        <!-- NEW: STOCKS TERMINAL (Placeholder for API) -->
        <div id="stocks" class="tab-content">
            <div class="card" style="margin-top:20px;">
                <p>MARKET STATUS</p>
                <h2 style="color: #00ff00;">BULLISH</h2>
                <p style="font-size:0.7rem;">Deploying Zapped Capital into Index Funds...</p>
            </div>
            <button class="zap-btn" style="background:#222; color:var(--gold); border:1px solid var(--gold);">VIEW PORTFOLIO</button>
        </div>

        <!-- NEW: CRYPTO VAULT (Placeholder for API) -->
        <div id="crypto" class="tab-content">
            <div class="card" style="margin-top:20px;">
                <p>SOVEREIGN ASSETS</p>
                <h2 style="color: var(--gold);">0.00 BTC</h2>
                <p style="font-size:0.7rem;">Security Level: Sovereign Military Grade</p>
            </div>
            <button class="zap-btn" style="background:#222; color:var(--gold); border:1px solid var(--gold);">ENTER VAULT</button>
        </div>
    </div>

    <script>
        let reclaimedValue = 0;
        let dailyLeakValue = 0;
        const vastuTips = ["North-East clarity creates wealth.", "South-West safe stabilizes gold.", "Face North for trading success."];

        async function initializeDashboard() {
            const urlParams = new URLSearchParams(window.location.search);
            const userEmail = urlParams.get('email');
            try {
                const response = await fetch(`https://aurummagnaglobal.pythonanywhere.com/get_latest_data?email=${encodeURIComponent(userEmail)}`);
                const data = await response.json();
                if (data && !data.error) {
                    dailyLeakValue = parseFloat(String(data['Daily Leak']).replace(/[^0-9.]/g, '')) || 0;
                    updateUI();
                }
            } catch (error) { dailyLeakValue = 250; updateUI(); }
        }

        function updateUI() {
            const monthlyGoal = dailyLeakValue * 30 || 1; 
            let percentage = Math.round((reclaimedValue / monthlyGoal) * 100);
            if (percentage < 5) percentage = 5;
            document.getElementById('strength').innerText = Math.min(percentage, 100) + "%";
            document.getElementById('target').innerText = "₹" + Math.round(monthlyGoal).toLocaleString();
            document.getElementById('reclaimed').innerText = "₹" + reclaimedValue.toLocaleString();
            document.getElementById('tip').innerText = vastuTips[Math.floor(Math.random() * vastuTips.length)];
        }

        function executeZap() {
            reclaimedValue += Math.round(dailyLeakValue);
            updateUI();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
