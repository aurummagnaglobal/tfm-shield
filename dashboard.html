<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Terminal | Wealth OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --bg: #0b0b0b;
            --card: #1a1a1a;
            --text: #ffffff;
            --border: #333;
        }

        .light-mode {
            --bg: #f5f5f5;
            --card: #ffffff;
            --text: #0b0b0b;
            --border: #ddd;
        }

        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; transition: 0.3s; }
        
        /* AUTH OVERLAY */
        #auth-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0b; z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .gate-box { background: #111; border: 1px solid var(--gold); padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 0 30px var(--gold-glow); }

        .container { max-width: 450px; margin: auto; padding: 20px; display: none; }
        
        /* HEADER & THEME TOGGLE */
        .header { display: flex; justify-content: space-between; align-items: center; }
        .theme-toggle { background: var(--gold); border: none; padding: 5px 10px; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 0.6rem; }

        .nav-tabs { display: flex; justify-content: space-around; margin: 20px 0; border-bottom: 1px solid var(--border); }
        .tab-btn { background: none; border: none; color: #888; font-family: 'Cinzel', serif; padding: 10px; cursor: pointer; font-size: 0.7rem; }
        .tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

        .meter-box { width: 220px; height: 220px; border: 4px solid var(--gold); border-radius: 50%; margin: 30px auto; display: flex; flex-direction: column; justify-content: center; text-align: center; box-shadow: 0 0 30px var(--gold-glow); }
        .victory-state { color: #00ff00; animation: pulse 1.5s infinite; }
        
        .card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .zap-btn { width: 100%; padding: 15px; background: var(--gold); border: none; color: #000; font-weight: bold; font-family: 'Cinzel', serif; border-radius: 5px; cursor: pointer; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <div id="auth-gate">
        <div class="gate-box">
            <h1 style="font-family: 'Cinzel'; color: var(--gold);">VAULT ACCESS</h1>
            <input type="email" id="authEmail" placeholder="Enter Email" style="width: 80%; padding: 10px; margin-bottom: 20px;">
            <button class="zap-btn" onclick="verifyAccess()">UNLOCK TERMINAL</button>
        </div>
    </div>

    <div class="container" id="app">
        <div class="header">
            <h1 style="font-family: 'Cinzel'; color: var(--gold); font-size: 1.2rem;">AURUM MAGNA</h1>
            <button class="theme-toggle" onclick="toggleTheme()">DARK/LIGHT</button>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="showTab('fortress')">FORTRESS</button>
            <button class="tab-btn" onclick="showTab('stocks')">STOCKS</button>
            <button class="tab-btn" onclick="showTab('crypto')">CRYPTO</button>
        </div>

        <!-- FORTRESS TAB -->
        <div id="fortress" class="tab-content active">
            <div class="meter-box" id="meter">
                <h2 id="strength" style="font-size: 3rem; margin: 0;">--%</h2>
                <p id="meter-label" style="font-size: 0.6rem; color: var(--gold);">SHIELD STRENGTH</p>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="card"><p style="font-size: 0.6rem;">TARGET</p><h3 id="target">₹0</h3></div>
                <div class="card"><p style="font-size: 0.6rem;">RECLAIMED</p><h3 id="reclaimed" style="color: var(--gold);">₹0</h3></div>
            </div>
            <button class="zap-btn" id="zapBtn" onclick="zapDebt()">EXECUTE DAILY ZAP</button>
        </div>

        <!-- STOCKS TAB (Full Platform) -->
        <div id="stocks" class="tab-content">
            <div class="card">
                <p style="font-size: 0.6rem;">NIFTY 50 LIVE</p>
                <h2>22,482.15 <span style="color: #00ff00; font-size: 0.8rem;">+1.12%</span></h2>
            </div>
            <div class="card">
                <b>STRATEGY: RECLAIMED CAPITAL</b>
                <p style="font-size: 0.7rem;">Deploying interest savings into high-yield Index Funds.</p>
                <button class="zap-btn" style="background: transparent; border: 1px solid var(--gold); color: var(--gold);">BUY NIFTY BEES</button>
            </div>
        </div>

        <!-- CRYPTO TAB (Full Platform) -->
        <div id="crypto" class="tab-content">
            <div class="card">
                <p style="font-size: 0.6rem;">BTC / USDT</p>
                <h2>$64,812.40 <span style="color: #ff4444; font-size: 0.8rem;">-0.24%</span></h2>
            </div>
            <button class="zap-btn">INVEST RECLAIMED BTC</button>
        </div>
    </div>

    <script>
        let currentEmail = "";
        let dailyLeak = 0;
        let reclaimed = 0;

        async function verifyAccess() {
            const email = document.getElementById('authEmail').value;
            const res = await fetch('https://aurummagnaglobal.pythonanywhere.com/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email})
            });
            if (res.ok) {
                currentEmail = email;
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                loadData();
            }
        }

        async function loadData() {
            const res = await fetch(`https://aurummagnaglobal.pythonanywhere.com/get_latest_data?email=${encodeURIComponent(currentEmail)}`);
            const data = await res.json();
            if (data && !data.error) {
                dailyLeak = parseFloat(data['Daily Leak']) || 0;
                updateUI();
            }
        }

        function updateUI() {
            const monthlyGoal = dailyLeak * 30 || 1;
            let percentage = Math.round((reclaimed / monthlyGoal) * 100);
            
            if (percentage >= 100) {
                document.getElementById('strength').innerText = "VICTORY";
                document.getElementById('strength').classList.add('victory-state');
                document.getElementById('meter-label').innerText = "SOVEREIGN STATUS REACHED";
                document.getElementById('zapBtn').innerText = "MINT WEALTH";
            } else {
                document.getElementById('strength').innerText = Math.max(5, percentage) + "%";
            }

            document.getElementById('target').innerText = "₹" + Math.round(monthlyGoal).toLocaleString();
            document.getElementById('reclaimed').innerText = "₹" + reclaimed.toLocaleString();
        }

        function zapDebt() {
            reclaimed += Math.round(dailyLeak);
            updateUI();
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }
    </script>
</body>
</html>
