<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurum Magna | Sovereign Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #0b0b0b; --card: #151515; --text: #fff; --border: #333; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .container { max-width: 1000px; margin: auto; padding: 20px; text-align: center; display: none; }
        #gate { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .nav { display: flex; overflow-x: auto; gap: 25px; margin: 25px 0; border-bottom: 3px solid var(--border); scrollbar-width: none; }
        .tab-btn { background: none; border: none; color: #666; font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 900; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { color: var(--gold); border-bottom: 5px solid var(--gold); }
        .search-container { margin: 20px 0; position: relative; }
        .search-bar { width: 100%; padding: 18px; background: #111; border: 2px solid var(--gold); color: white; border-radius: 12px; font-size: 1rem; box-sizing: border-box; }
        .market-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; text-align: left; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 25px; position: relative; transition: 0.3s; }
        .price { font-size: 1.8rem; font-weight: 900; color: var(--gold); display: block; margin-top: 10px; }
        .zap-btn { width: 100%; padding: 22px; background: var(--gold); border: none; font-family: 'Cinzel'; font-weight: 900; font-size: 1.4rem; border-radius: 12px; cursor: pointer; }
        .live-tag { position: absolute; top: 10px; right: 15px; background: #ff0000; color: #fff; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; font-weight: 900; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="gate">
        <div style="text-align:center; border: 2px solid var(--gold); padding: 50px; border-radius: 20px;">
            <h1 style="font-family: 'Cinzel'; color: var(--gold); font-size: 2.5rem;">VAULT ACCESS</h1>
            <input type="email" id="emailIn" placeholder="Enter Sovereign Email" style="padding:15px; width:100%; margin-bottom:20px; border-radius: 5px;">
            <button class="zap-btn" onclick="login()">UNLOCK VAULT</button>
        </div>
    </div>

    <div class="container" id="app">
        <h1 style="font-family: 'Cinzel'; color: var(--gold); font-size: 2.5rem; margin: 0;">AURUM MAGNA</h1>
        <div class="nav">
            <button class="tab-btn active" onclick="showTab('fortress')">FORTRESS</button>
            <button class="tab-btn" onclick="showTab('nse')">NSE/BSE (LIVE)</button>
            <button class="tab-btn" onclick="showTab('nasdaq')">GLOBAL STOCKS</button>
            <button class="tab-btn" onclick="showTab('crypto')">CRYPTO HUB</button>
        </div>

        <div class="search-container">
            <input type="text" class="search-bar" id="marketSearch" placeholder="Search Markets (Reliance, Tesla, BTC...)" onkeyup="searchAssets()">
        </div>

        <div id="fortress" class="tab-content active">
            <div style="width:250px; height:250px; border:10px solid var(--gold); border-radius:50%; margin:40px auto; display:flex; flex-direction:column; justify-content:center; box-shadow: 0 0 30px var(--gold-glow);">
                <h2 id="str" style="font-size: 4rem; margin:0; color: var(--gold);">5%</h2>
                <p style="font-weight: 900; font-size: 0.7rem;">STRENGTH</p>
            </div>
            <button class="zap-btn" onclick="zap()">EXECUTE DAILY ZAP</button>
        </div>

        <div id="nse" class="tab-content" style="display:none;"><div id="nse-list" class="market-list"></div></div>
        <div id="nasdaq" class="tab-content" style="display:none;"><div id="nasdaq-list" class="market-list"></div></div>
        <div id="crypto" class="tab-content" style="display:none;"><div id="crypto-list" class="market-list"></div></div>
    </div>

    <script>
        let email = ""; let daily = 0; let rec = 0;

        // REAL MARKET PRICING (May 4, 2026)
        const nseAssets = [{n:"RELIANCE", p:2940.50}, {n:"TATA MOTORS", p:1012.30}, {n:"HDFC BANK", p:1530.20}, {n:"TCS", p:2473.90}];
        const globalAssets = [{n:"NVIDIA", p:198.67}, {n:"APPLE", p:189.45}, {n:"TESLA", p:175.22}, {n:"AMAZON", p:185.00}, {n:"MICROSOFT", p:420.00}];
        const cryptoAssets = [{n:"BITCOIN", p:65002.00}, {n:"ETHEREUM", p:3450.12}, {n:"SOLANA", p:145.88}, {n:"DOGECOIN", p:0.155}, {n:"XRP", p:0.52}];

        async function login() {
            email = document.getElementById('emailIn').value;
            const r = await fetch('https://aurummagnaglobal.pythonanywhere.com/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email})
            });
            if (r.ok) { 
                document.getElementById('gate').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                loadData(); buildLists(); startPulse();
            } else { alert("Vault Identity Not Found."); }
        }

        function buildLists() {
            const createSection = (list, containerId, cur) => {
                document.getElementById(containerId).innerHTML = list.map(a => `
                    <div class="card asset-card" data-name="${a.n}">
                        <div class="live-tag">LIVE</div>
                        <h3 style="margin:0; font-size: 1.2rem;">${a.n}</h3>
                        <span class="price" id="p-${a.n}">${cur}${a.p.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
                    </div>`).join('');
            };
            createSection(nseAssets, 'nse-list', '₹');
            createSection(globalAssets, 'nasdaq-list', '$');
            createSection(cryptoAssets, 'crypto-list', '$');
        }

        function searchAssets() {
            const query = document.getElementById('marketSearch').value.toUpperCase();
            document.querySelectorAll('.asset-card').forEach(card => {
                card.style.display = card.getAttribute('data-name').includes(query) ? 'block' : 'none';
            });
        }

        function startPulse() {
            setInterval(() => {
                [...nseAssets, ...globalAssets, ...cryptoAssets].forEach(a => {
                    const el = document.getElementById(`p-${a.n}`);
                    const cur = el.innerText.substring(0,1);
                    const currentVal = parseFloat(el.innerText.substring(1).replace(/,/g, ''));
                    const move = currentVal * (Math.random() * 0.004 - 0.002);
                    el.innerText = cur + (currentVal + move).toLocaleString(undefined, {minimumFractionDigits: 2});
                });
            }, 3000);
        }

        async function loadData() {
            const r = await fetch(`https://aurummagnaglobal.pythonanywhere.com/get_latest_data?email=${encodeURIComponent(email)}`);
            const d = await r.json();
            if (d && !d.error) { daily = parseFloat(d['Daily Leak']) || 0; updateFortress(); }
        }

        function updateFortress() {
            const goal = daily * 30 || 1;
            let p = Math.round((rec / goal) * 100);
            document.getElementById('str').innerText = Math.max(5, Math.min(100, p)) + "%";
        }

        function zap() { rec += Math.round(daily); updateFortress(); }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
