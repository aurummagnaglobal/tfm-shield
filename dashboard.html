<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Terminal | Aurum Magna Global</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.4); --obsidian: #0b0b0b; --card-bg: #1a1a1a; }
        body { background-color: var(--obsidian); color: white; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* LOGIN OVERLAY */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--obsidian); z-index: 1000; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .login-box { background: #111; border: 1px solid var(--gold); padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 0 30px var(--gold-glow); }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 5px; }

        .dashboard-container { width: 100%; max-width: 450px; margin: auto; padding: 20px; text-align: center; display: none; }
        
        /* TABS & UI */
        .nav-tabs { display: flex; justify-content: space-around; margin: 20px 0; border-bottom: 1px solid #333; }
        .tab-btn { background: none; border: none; color: #666; font-family: 'Cinzel', serif; padding: 10px; cursor: pointer; font-size: 0.75rem; }
        .tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .meter-box { width: 220px; height: 220px; border: 2px solid var(--gold); border-radius: 50%; margin: 20px auto; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 0 25px var(--gold-glow); background: radial-gradient(circle, #222 0%, #000 100%); transition: 0.5s; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid #333; margin-bottom: 15px; }
        .zap-btn { width: 100%; padding: 15px; background: var(--gold); border: none; color: black; font-weight: bold; font-family: 'Cinzel', serif; border-radius: 5px; cursor: pointer; }
        .market-up { color: #00ff00; font-weight: bold; }
        .market-down { color: #ff4444; font-weight: bold; }
    </style>
</head>
<body>

    <!-- AUTHENTICATION GATE -->
    <div id="login-overlay">
        <div class="login-box">
            <h1 style="font-family: 'Cinzel'; color: var(--gold);">VAULT ACCESS</h1>
            <p style="color: #888; font-size: 0.8rem;">Enter your Sovereign Email</p>
            <input type="email" id="loginEmail" placeholder="email@example.com">
            <button class="zap-btn" onclick="attemptLogin()">UNLOCK FORTRESS</button>
        </div>
    </div>

    <!-- MAIN TERMINAL -->
    <div class="dashboard-container" id="main-terminal">
        <h1 style="font-size: 1.5rem;">AURUM MAGNA</h1>
        
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('debt')">🛡️ DEBT</button>
            <button class="tab-btn" onclick="switchTab('stocks')">📈 STOCKS</button>
            <button class="tab-btn" onclick="switchTab('crypto')">₿ CRYPTO</button>
        </div>

        <!-- DEBT SECTION (INTACT) -->
        <div id="debt" class="tab-content active">
            <div class="meter-box" id="meter">
                <h2 id="strength">--%</h2>
                <p style="color:var(--gold); font-size:0.6rem;">SHIELD STRENGTH</p>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="card"><p style="font-size:0.6rem;">TARGET</p><h3 id="target">₹0</h3></div>
                <div class="card"><p style="font-size:0.6rem;">RECLAIMED</p><h3 id="reclaimed" style="color:var(--gold);">₹0</h3></div>
            </div>
            <button class="zap-btn" onclick="executeZap()">EXECUTE DAILY ZAP</button>
        </div>

        <!-- LIVE STOCK TERMINAL -->
        <div id="stocks" class="tab-content">
            <div class="card">
                <p style="font-size:0.7rem;">LIVE NIFTY 50 SIGNAL</p>
                <h2 id="stock-price">22,450.00</h2>
                <span id="stock-change" class="market-up">+1.24%</span>
            </div>
            <p style="font-size:0.7rem; color:#666;">Deploying Zapped capital into high-alpha growth...</p>
        </div>

        <!-- LIVE CRYPTO TERMINAL -->
        <div id="crypto" class="tab-content">
            <div class="card">
                <p style="font-size:0.7rem;">BTC / USDT</p>
                <h2 id="crypto-price">$64,200.00</h2>
                <span id="crypto-change" class="market-down">-0.45%</span>
            </div>
        </div>
    </div>

    <script>
        let currentEmail = "";
        let dailyLeakValue = 0;
        let reclaimedValue = 0;

        async function attemptLogin() {
            const email = document.getElementById('loginEmail').value;
            const response = await fetch(`https://aurummagnaglobal.pythonanywhere.com/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email})
            });
            const data = await response.json();
            if (data.status === "Success") {
                currentEmail = email;
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-terminal').style.display = 'block';
                loadSovereignData();
                startMarketFeeds();
            } else {
                alert(data.message);
            }
        }

        async function loadSovereignData() {
            const response = await fetch(`https://aurummagnaglobal.pythonanywhere.com/get_latest_data?email=${encodeURIComponent(currentEmail)}`);
            const data = await response.json();
            if (data && !data.error) {
                dailyLeakValue = parseFloat(String(data['Daily Leak']).replace(/[^0-9.]/g, '')) || 0;
                updateUI();
            }
        }

        function updateUI() {
            const goal = dailyLeakValue * 30 || 1;
            let p = Math.round((reclaimedValue / goal) * 100);
            document.getElementById('strength').innerText = Math.max(5, Math.min(100, p)) + "%";
            document.getElementById('target').innerText = "₹" + Math.round(goal).toLocaleString();
            document.getElementById('reclaimed').innerText = "₹" + reclaimedValue.toLocaleString();
        }

        function executeZap() {
            reclaimedValue += Math.round(dailyLeakValue);
            updateUI();
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // SIMULATED LIVE FEEDS
        function startMarketFeeds() {
            setInterval(() => {
                const stock = 22400 + (Math.random() * 100);
                const crypto = 64000 + (Math.random() * 500);
                document.getElementById('stock-price').innerText = stock.toFixed(2);
                document.getElementById('crypto-price').innerText = "$" + crypto.toLocaleString();
            }, 3000);
        }
    </script>
</body>
</html>
