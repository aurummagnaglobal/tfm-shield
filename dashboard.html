<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Fortress Dashboard | Aurum Magna Global</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --obsidian: #0b0b0b;
            --card-bg: #1a1a1a;
        }

        body {
            background-color: var(--obsidian);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
        }

        h1 { font-family: 'Cinzel', serif; color: var(--gold); letter-spacing: 2px; }

        .meter-box {
            width: 250px;
            height: 250px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 0 25px var(--gold-glow);
            background: radial-gradient(circle, #222 0%, #000 100%);
        }

        .meter-box h2 { font-size: 3rem; color: var(--gold); margin: 0; }
        .meter-box p { color: var(--gold); text-transform: uppercase; font-size: 0.7rem; margin: 0; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .card p { color: #888; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 5px; }
        .card h3 { color: white; margin: 0; font-size: 1.2rem; }

        .vastu-card {
            background: #111;
            border-left: 4px solid var(--gold);
            margin-top: 25px;
            padding: 15px;
            text-align: left;
            border-radius: 5px;
        }

        .vastu-card b { color: var(--gold); font-family: 'Cinzel', serif; }

        .zap-btn {
            width: 100%;
            margin-top: 30px;
            padding: 15px;
            background: var(--gold);
            border: none;
            color: black;
            font-weight: bold;
            font-family: 'Cinzel', serif;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h1>GOLD FORTRESS</h1>
    <p style="color: #666; font-size: 0.8rem;">Aurum Magna Global Private Limited</p>

    <div class="meter-box">
        <h2 id="strength">42%</h2>
        <p>Shield Strength</p>
    </div>

    <div class="stats-grid">
        <div class="card">
            <p>Days to Sovereignty</p>
            <h3 id="days">365</h3>
        </div>
        <div class="card">
            <p>Interest Reclaimed</p>
            <h3 id="reclaimed" style="color: var(--gold);">₹12,500</h3>
        </div>
    </div>

    <div class="vastu-card">
        <b>🛡️ FINANCIAL VASTU</b>
        <p id="tip" style="font-size: 0.9rem; line-height: 1.4;">North-East clarity creates wealth flow. Ensure no heavy objects are placed in this corner of your office.</p>
    </div>

    <button class="zap-btn" onclick="executeZap()">EXECUTE DAILY ZAP</button>
</div>

<script>
    // 1. Vastu Library
    const vastuTips = [
        "North-East clarity creates wealth flow. Keep this corner light.",
        "Place your safe or locker in the South-West to stabilize wealth.",
        "Ensure your desk faces North or East to attract new opportunities.",
        "A small brass vessel of water in the North enhances cash flow.",
        "Avoid mirrors directly facing your safe to maintain financial energy.",
        "Purple represents wealth; a small purple plant in the North can boost gains."
    ];

    // 2. The Rotation Function
    function rotateVastu() {
        const randomTip = vastuTips[Math.floor(Math.random() * vastuTips.length)];
        const tipElement = document.getElementById('tip');
        if (tipElement) {
            tipElement.innerText = randomTip;
        }
    }

    // 3. The Master Zap Function
    function executeZap() {
        // Confirmation alert
        alert("Daily Zap Executed! ₹250 redirected from Interest to Gold Fortress.");
        
        // Update the UI numbers[cite: 3]
        const reclaimedElement = document.getElementById('reclaimed');
        if (reclaimedElement) {
            reclaimedElement.innerText = "₹12,750"; 
        }

        // Trigger the Vastu Rotation[cite: 3]
        rotateVastu();
    }
</script>

</body>
</html>
