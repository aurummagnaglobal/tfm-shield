<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TFM Sovereign Shield</title>
    <style>
        body { background-color: #0b0b0b; color: #d4af37; font-family: 'Cinzel', serif; text-align: center; padding: 50px; }
        input { padding: 12px; margin: 10px; width: 300px; background: #1a1a1a; border: 1px solid #d4af37; color: white; border-radius: 5px; }
        button { padding: 15px 40px; background: #d4af37; color: black; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #fff; color: #000; }
        #result { margin-top: 30px; font-size: 1.2em; color: #ffffff; min-height: 200px; }
        .shield-box { border: 2px solid #d4af37; padding: 25px; border-radius: 10px; background: #1a1a1a; max-width: 500px; margin: 0 auto; }
    </style>
</head>
<body>
    <h1>🛡️ SOVEREIGN SHIELD ANALYSIS</h1>
    <p>Aurum Magna Global | Founding 100 Phase</p>
    
    <div id="formContainer">
        <input type="text" id="userName" placeholder="Your Name"><br>
        <input type="number" id="debtAmt" placeholder="Loan Amount (e.g., 500000)"><br>
        <input type="number" id="intRate" placeholder="Interest Rate % (e.g., 36)"><br>
        <div id="formContainer">
    <input type="text" id="userName" placeholder="Your Name"><br>
    <!-- New Email Field for Phase 2 Automation -->
    <input type="email" id="userEmail" placeholder="Your Email Address"><br>
    </div>
    
    <div id="result"></div>

    <script>
    async function runAnalysis() {
        const btn = document.getElementById("analyzeBtn");
        const resDiv = document.getElementById("result");
        
        // 1. Clear and Start Timer
        resDiv.innerHTML = "";
        let timer = 5;
        const interval = setInterval(() => {
            btn.innerText = `Calculating Freedom in ${timer}s...`;
            timer--;
            if (timer < 0) clearInterval(interval);
        }, 1000);

        try {
            // 2. Execute Backend Call
            const response = await fetch('https://aurummagnaglobal.pythonanywhere.com/analyze', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: document.getElementById("userName").value,
                    debt: document.getElementById("debtAmt").value,
                    rate: document.getElementById("intRate").value,
                    emi: document.getElementById("userEmi").value
                })
            });
            
            const data = await response.json();
            
            // 3. Display Result
            btn.innerText = "REPORT GENERATED";
            resDiv.innerHTML = `
                <div class="shield-box">
                    <h3>🛡️ DIAGNOSIS COMPLETE</h3>
                    <p>Daily Interest Leak: <b style="color:#d4af37;">${data.daily_leak}</b></p>
                    <p>Yearly Gold Loss: <b style="color:#d4af37;">${data.yearly_leak}</b></p>
                    <hr style="border-color: #d4af37;">
                    <p><strong>STRATEGY:</strong> ${data.action}</p>
                </div>
            `;
        } catch (error) {
            btn.innerText = "EXECUTE SHIELD ANALYSIS";
            resDiv.innerHTML = "<p style='color:red;'>Connection Error. Please ensure you clicked 'Reload' on PythonAnywhere Web tab.</p>";
        }
    }
    </script>
</body>
</html>
